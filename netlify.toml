# Netlify 無料デプロイ設定
# https://app.netlify.com から GitHub リポジトリを接続するか、
# interactive-video フォルダをドラッグ＆ドロップでも公開できます。

[build]
  publish = "interactive-video"
  command = "echo Static site — no build required"

[build.environment]
  NODE_VERSION = "20"

# 動画・JSON の配信設定
[[headers]]
  for = "/videos/*"
  [headers.values]
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/scenario.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
