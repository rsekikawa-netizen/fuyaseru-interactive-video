<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>プロジェクト一覧 — インタラクティブ動画</title>
<style>
  :root { color-scheme: dark; --bg:#0d0f14; --panel:#141820; --line:#252a36; --accent:#2b6cff; --text:#e8eaed; --muted:#9aa0aa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, "Segoe UI", "Yu Gothic UI", sans-serif; min-height:100vh; }
  header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; }
  main { max-width:880px; margin:0 auto; padding:24px; display:grid; gap:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card h2 { margin:0 0 12px; font-size:15px; color:var(--muted); letter-spacing:.05em; }
  .list { display:flex; flex-direction:column; gap:10px; }
  .item { display:flex; align-items:center; gap:12px; padding:14px 16px; background:#1a1d26; border:1px solid var(--line); border-radius:10px; flex-wrap:wrap; }
  .item .info { flex:1; min-width:180px; }
  .item .id { font-weight:700; font-size:15px; }
  .item .title { font-size:13px; color:var(--muted); margin-top:2px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  a.btn, button.btn { display:inline-block; border:1px solid rgba(255,255,255,.25); background:var(--accent); color:#fff; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; }
  a.btn.ghost, button.btn.ghost { background:transparent; }
  button.btn.danger { background:#8a2b2b; border-color:#8a2b2b; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  input { flex:1; min-width:160px; border:1px solid var(--line); background:#0f1218; color:var(--text); border-radius:8px; padding:10px 12px; font:inherit; }
  .hint { font-size:12px; color:var(--muted); line-height:1.6; margin-top:8px; }
  #toast { position:fixed; bottom:18px; right:18px; background:#1f6f43; color:#fff; padding:10px 16px; border-radius:8px; opacity:0; transition:.25s; }
  #toast.show { opacity:1; }
  .empty { color:var(--muted); font-size:14px; padding:12px 0; }
  .hub-note { display:none; font-size:13px; color:#b8c4dc; margin:0; padding:10px 14px; background:#1a2438; border:1px solid #2a3a5c; border-radius:10px; }
  .hub-note.show { display:block; }
</style>
</head>
<body>
<header>
  <h1>🎬 インタラクティブ動画 — プロジェクト</h1>
  <p class="hub-note show" style="margin:0">共有URL: <strong>https://fuyaseru-interactive-video.netlify.app/</strong></p>
</header>
<main>
  <div class="card">
    <h2>新規プロジェクト</h2>
    <div class="row">
      <input id="newId" placeholder="ID（例: lp-campaign-01）" />
      <input id="newTitle" placeholder="タイトル（例: 春キャンペーンLP）" />
      <button class="btn" id="btnCreate">＋ 作成</button>
    </div>
    <p class="hint">ID は英数字・ハイフン・アンダースコアのみ。作成後、エディターで分岐と動画を設定します。</p>
  </div>
  <div class="card">
    <h2>プロジェクト一覧</h2>
    <div class="list" id="list"><div class="empty">読み込み中…</div></div>
  </div>
</main>
<div id="toast"></div>
<script src="project.js?v=4"></script>
<script>
const $ = (s) => document.querySelector(s);
const toast = (m) => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); };
function link(path, id) { return `${path}?project=${encodeURIComponent(id)}`; }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

async function initHub() {
  if (window.self !== window.top) {
    const q = new URLSearchParams(location.search);
    if (!q.has("project")) q.set("project", "default");
    location.replace("play.html?" + q.toString());
    return;
  }
  const api = await hasProjectApi();
  if (!api) {
    location.replace("play.html?project=default");
    return;
  }
  document.getElementById("hubNote")?.classList.add("show");
  loadList();
  bindCreate();
}

async function loadList() {
  let data;
  try {
    data = await (await fetch("/api/projects?_=" + Date.now(), { cache: "no-store" })).json();
  } catch {
    data = await (await fetch("projects/index.json?_=" + Date.now(), { cache: "no-store" })).json();
  }
  const list = $("#list");
  list.innerHTML = "";
  if (!data.projects?.length) {
    list.innerHTML = '<div class="empty">プロジェクトがありません</div>';
    return;
  }
  for (const p of data.projects) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `
      <div class="info"><div class="id">${esc(p.id)}</div><div class="title">${esc(p.title || p.id)}</div></div>
      <div class="actions">
        <a class="btn" href="${link("play.html", p.id)}">▶ 再生</a>
        <a class="btn ghost" href="${link("editor/", p.id)}">📝 編集</a>
        <a class="btn ghost" href="${link("map/", p.id)}" target="_blank">🗺 マップ</a>
        <a class="btn ghost" href="${link("embed/", p.id)}">📋 埋込</a>
        ${p.id !== "default" ? `<button class="btn danger ghost" data-del="${esc(p.id)}">削除</button>` : ""}
      </div>`;
    list.appendChild(el);
  }
  list.querySelectorAll("[data-del]").forEach((b) => {
    b.onclick = async () => {
      if (!confirm(`プロジェクト "${b.dataset.del}" を削除しますか？`)) return;
      try {
        const res = await fetch("/api/projects?id=" + encodeURIComponent(b.dataset.del), { method: "DELETE" });
        const j = await res.json();
        if (!res.ok) return alert(j.error || "削除失敗");
        toast("削除しました");
        loadList();
      } catch {
        alert("サーバーに接続できません。Node サーバー（npm start / クラウド本番）で開いてください");
      }
    };
  });
}

function bindCreate() {
  $("#btnCreate").onclick = async () => {
  const id = $("#newId").value.trim();
  const title = $("#newTitle").value.trim() || id;
  if (!id) return alert("ID を入力してください");
  if (!/^[a-zA-Z0-9_-]+$/.test(id)) return alert("ID は英数字・ハイフン・アンダースコアのみ");
  try {
    const res = await fetch("/api/projects", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, title }),
    });
    const j = await res.json();
    if (!res.ok) return alert(j.error || "作成失敗");
    toast("作成しました");
    location.href = link("editor/", id);
  } catch {
    alert("サーバーに接続できません。Node サーバー（npm start / クラウド本番）で開いてください");
  }
  };
}

initHub();
</script>
</body>
</html>
