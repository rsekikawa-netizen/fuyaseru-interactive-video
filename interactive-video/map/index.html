<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>分岐マップ</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0d0f14; color:#e8eaed; font-family: system-ui, "Segoe UI", "Yu Gothic UI", sans-serif; }
  header { padding:14px 20px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #1e222c; }
  header h1 { font-size:16px; margin:0; font-weight:700; }
  header .legend { display:flex; gap:14px; margin-left:auto; font-size:12px; color:#aab0bb; align-items:center; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle; }
  a.back { color:#7ea2ff; text-decoration:none; font-size:13px; }
  #wrap { width:100%; height:calc(100vh - 52px); overflow:auto; }
  svg { display:block; }
  .edge { stroke:#3a4150; stroke-width:2; fill:none; marker-end:url(#arrow); }
  .edge-label { fill:#9aa0aa; font-size:12px; }
  .node rect { rx:10; stroke-width:2; }
  .node text.title { fill:#fff; font-size:14px; font-weight:700; }
  .node text.sub { fill:#c3c8d2; font-size:11px; }
  .n-start rect { fill:#173a6b; stroke:#2b6cff; }
  .n-branch rect { fill:#1a1d26; stroke:#3a4150; }
  .n-good rect { fill:#123a24; stroke:#1f6f43; }
  .n-bad  rect { fill:#3a1717; stroke:#8a2b2b; }
  .n-true rect { fill:#241a4a; stroke:#7a5cff; }
  .n-normal rect { fill:#22262f; stroke:#4a4f5c; }
  #err { padding:24px; color:#e2a0a0; }
</style>
</head>
<body>
  <header>
    <h1 id="ttl">分岐マップ</h1>
    <a class="back" href="index.html">← プレイヤーに戻る</a>
    <div class="legend">
      <span><span class="dot" style="background:#2b6cff"></span>スタート</span>
      <span><span class="dot" style="background:#3a4150"></span>分岐</span>
      <span><span class="dot" style="background:#1f6f43"></span>GOOD</span>
      <span><span class="dot" style="background:#8a2b2b"></span>BAD</span>
      <span><span class="dot" style="background:#7a5cff"></span>TRUE</span>
    </div>
  </header>
  <div id="wrap"><svg id="svg"></svg></div>
  <div id="err" style="display:none"></div>

<script>
const NS = "http://www.w3.org/2000/svg";
const NODE_W = 190, NODE_H = 58, GAP_X = 70, GAP_Y = 60, PAD = 40;

async function boot() {
  let scenario;
  try {
    scenario = await (await fetch("../scenario.json?_=" + Date.now(), { cache: "no-store" })).json();
  } catch (e) {
    document.getElementById("svg").style.display = "none";
    const err = document.getElementById("err");
    err.style.display = "block";
    err.innerHTML = "scenario.json を読み込めませんでした。ローカルサーバー経由で開いてください。";
    return;
  }
  document.getElementById("ttl").textContent = "分岐マップ — " + (scenario.title || "");
  render(scenario);
}

// 深さ(BFS)で列を決め、同じ深さのノードを縦に並べる簡易レイアウト
function layout(scenario) {
  const nodes = scenario.nodes, start = scenario.start;
  const depth = {}; const queue = [[start, 0]]; depth[start] = 0;
  while (queue.length) {
    const [id, d] = queue.shift();
    const n = nodes[id]; if (!n) continue;
    for (const c of (n.choices || [])) {
      if (depth[c.next] === undefined || depth[c.next] < d + 1) {
        depth[c.next] = Math.max(depth[c.next] ?? 0, d + 1);
        queue.push([c.next, d + 1]);
      }
    }
  }
  // 列ごとにまとめる
  const cols = {};
  for (const id of Object.keys(nodes)) {
    const d = depth[id] ?? 0;
    (cols[d] = cols[d] || []).push(id);
  }
  const pos = {};
  Object.keys(cols).map(Number).sort((a,b)=>a-b).forEach(d => {
    cols[d].forEach((id, i) => {
      pos[id] = {
        x: PAD + d * (NODE_W + GAP_X),
        y: PAD + i * (NODE_H + GAP_Y)
      };
    });
  });
  const maxCol = Math.max(...Object.keys(cols).map(Number));
  const maxRows = Math.max(...Object.values(cols).map(c => c.length));
  return { pos, width: PAD*2 + (maxCol+1)*NODE_W + maxCol*GAP_X, height: PAD*2 + maxRows*(NODE_H+GAP_Y) };
}

function classFor(scenario, id) {
  const n = scenario.nodes[id];
  if (id === scenario.start) return "n-start";
  if (n.ending) return "n-" + (n.endingType || "normal");
  return "n-branch";
}

function render(scenario) {
  const svg = document.getElementById("svg");
  const { pos, width, height } = layout(scenario);
  svg.setAttribute("width", width); svg.setAttribute("height", height);
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  // 矢印マーカー
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4150"/></marker>`;
  svg.appendChild(defs);

  // エッジ
  for (const id of Object.keys(scenario.nodes)) {
    const n = scenario.nodes[id];
    for (const c of (n.choices || [])) {
      if (!pos[c.next]) continue;
      const a = pos[id], b = pos[c.next];
      const x1 = a.x + NODE_W, y1 = a.y + NODE_H/2;
      const x2 = b.x, y2 = b.y + NODE_H/2;
      const mx = (x1 + x2) / 2;
      const path = document.createElementNS(NS, "path");
      path.setAttribute("class", "edge");
      path.setAttribute("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      svg.appendChild(path);
      const lbl = document.createElementNS(NS, "text");
      lbl.setAttribute("class", "edge-label");
      lbl.setAttribute("x", mx); lbl.setAttribute("y", (y1 + y2) / 2 - 6);
      lbl.setAttribute("text-anchor", "middle");
      lbl.textContent = c.label;
      svg.appendChild(lbl);
    }
  }

  // ノード
  for (const id of Object.keys(scenario.nodes)) {
    if (!pos[id]) continue;
    const n = scenario.nodes[id], p = pos[id];
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "node " + classFor(scenario, id));
    g.setAttribute("transform", `translate(${p.x},${p.y})`);
    const rect = document.createElementNS(NS, "rect");
    rect.setAttribute("width", NODE_W); rect.setAttribute("height", NODE_H);
    g.appendChild(rect);
    const t1 = document.createElementNS(NS, "text");
    t1.setAttribute("class", "title"); t1.setAttribute("x", 14); t1.setAttribute("y", 24);
    t1.textContent = n.endingTitle || id;
    g.appendChild(t1);
    const t2 = document.createElementNS(NS, "text");
    t2.setAttribute("class", "sub"); t2.setAttribute("x", 14); t2.setAttribute("y", 44);
    t2.textContent = n.ending ? ("エンディング (" + (n.endingType || "normal") + ")") : (id + " — 分岐 " + (n.choices?.length || 0));
    g.appendChild(t2);
    svg.appendChild(g);
  }
}

boot();
</script>
</body>
</html>
